# This starter workflow is for a CMake project running on a single platform.
# There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev", "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3 

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-common-dev mesa-utils libgl1-mesa-dev
        sudo apt-get install -y libfreetype6-dev libudev-dev libopenal-dev libflac-dev libogg-dev libvorbis-dev
        sudo apt-get install -y ninja-build libclang-dev libclang-cpp-dev clang-format clang-tidy 
        sudo apt-get install -y libxss-dev libx11-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libxtst-dev
        sudo apt-get install -y pkg-config libunwind-dev libunwind8

    # Configure CMake for default build (without Emscripten)
    - name: Configure CMake for Default Build
      run: cmake --preset build-ninja

    - name: Build Default
      run: cmake --build build-ninja --config ${{env.BUILD_TYPE}}

