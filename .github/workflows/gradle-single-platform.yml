name: Java CI with LWJGL

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install virtual display and graphics drivers
    - name: Install Native Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev

    # 3. Set up the Java environment
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # 4. Compile and run tests inside the virtual display
    - name: Build and Test with Xvfb
    run: |
      xvfb-run --server-args="-screen 0 1024x768x24" ./gradlew test

    # 5. Build the project
    - name: Build Project
      run: ./gradlew build
