plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '6.25.0'
}

group   = 'com.jbreakingwalls'
version = '1.1.2'

java {
    // Java 21 LTS: virtual threads, sequenced collections, sealed classes, record patterns
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.jbreakingwalls.Main'
    // LWJGL requires off-heap native access on JVM 17+
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        // Java 21 ZGC: low-pause GC; drop-in replacement for G1 on game loops
        '-XX:+UseZGC',
        '-XX:+ZGenerational'
    ]
}

// ── Dependency versions ──────────────────────────────────────────────────────
ext {
    lwjglVersion  = '3.3.3'   // LWJGL 3.3.3 – stable, matches imgui-java 1.86.11
    imguiVersion  = '1.86.11' // SpaiR/imgui-java – GLFW+GL3 backends included
    jomlVersion   = '1.10.7'  // JOML – Java OpenGL Math Library (replaces GLM)
    gsonVersion   = '2.11.0'  // Gson – JSON config parsing (replaces nlohmann/json)
    jnoiseVersion = '4.1.0'   // JNoise-Pipeline – replaces FastNoise from C++ deps

    // ── Native classifier ────────────────────────────────────────────────────
    // Change to 'natives-linux' or 'natives-macos-arm64' for other targets.
    // Multi-platform: add more runtimeOnly lines below with each classifier.
    lwjglNatives  = 'natives-windows'
    imguiNatives  = 'imgui-java-natives-windows'
}

repositories {
    mavenCentral()
}

spotless {
    encoding 'UTF-8'
    lineEndings 'UNIX'

    java {
        target 'src/**/*.java'
        trimTrailingWhitespace()
        indentWithSpaces(4)
        endWithNewline()
        removeUnusedImports()
    }

    format('buildFiles') {
        target '*.gradle', '**/*.gradle', '**/*.xml', '**/*.properties'
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }

    format('markdown') {
        target '*.md', '**/*.md'
        endWithNewline()
    }
}

dependencies {
    // ── LWJGL Bill of Materials (pins all sub-module versions) ───────────────
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    // Core + modules we actually use
    implementation 'org.lwjgl:lwjgl'           // core runtime
    implementation 'org.lwjgl:lwjgl-glfw'      // window + input (replaces SFML window)
    implementation 'org.lwjgl:lwjgl-opengl'    // OpenGL 3.3+ bindings (replaces glad)
    implementation 'org.lwjgl:lwjgl-stb'       // STB image/truetype (same lib, JNI-bound)
    implementation 'org.lwjgl:lwjgl-openal'    // OpenAL-Soft – replaces SFML audio; EFX reverb support

    // Natives – Windows x64 only; add more classifiers for cross-platform
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-stb::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-openal::${lwjglNatives}"

    // ── Dear ImGui (replaces dearimgui + imgui_impl_sfml + imgui_impl_opengl3) ─
    // imgui-java-binding    → core ImGui Java API
    // imgui-java-lwjgl3     → ImGuiImplGlfw + ImGuiImplGl3 backends
    // imgui-java-natives-*  → pre-built native .dll / .so / .dylib
    implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
    runtimeOnly    "io.github.spair:${imguiNatives}:${imguiVersion}"

    // ── JOML (replaces GLM) ──────────────────────────────────────────────────
    // Matrix4f.ortho, Vector3f, etc. – identical API shape to GLM
    implementation "org.joml:joml:${jomlVersion}"

    // ── Gson (replaces nlohmann/json) ────────────────────────────────────────
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // ── JNoise (replaces FastNoise / MazeBuilder noise from C++) ─────────────
    // Pipeline API chains octaves, ridged, domain-warp with zero extra allocs
    implementation "de.articdive:jnoise-pipeline:${jnoiseVersion}"
}

// ── Fat JAR (run without Gradle after build) ─────────────────────────────────
jar {
    manifest { attributes 'Main-Class': application.mainClass }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
